<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Staff access | Library Confab</title>
<link rel="icon" href="images/favicon-32.png" type="image/png" sizes="32x32"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/variables.css"/>
<link rel="stylesheet" href="css/register.css"/>
</head>
<body>
<div class="card">
  <div class="left">
    <div class="xu-logo-panel">
      <img class="xu-logo" src="images/xu-logo.png" width="280" height="180" alt="Xavier University"/>
    </div>
    <div class="tagline">
      <h1>Staff<br/><em>accounts.</em></h1>
      <p>Library staff sign-ins are created<br/>by a system administrator.</p>
    </div>
  </div>
  <div class="right">
    <div class="fhead">
      <h2>No self-registration</h2>
      <p>For security, staff accounts are managed in the cloud via MongoDB.</p>
    </div>
    <div class="banner banner--staff">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Contact your administrator
    </div>
    <div class="field" style="margin-bottom:1.5rem">
      <p style="font-size:14px;color:var(--text-soft);line-height:1.65">
        Your administrator must add your official <strong>@xu.edu.ph</strong> email to the database.
      </p>
    </div>
    <a class="btn" href="LogIn.html" style="display:block;text-align:center;text-decoration:none;">Back to sign in</a>
  </div>
</div>
</body>
</html>
