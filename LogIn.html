<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Library Confab Reservation | Xavier Ateneo</title>
<link rel="icon" href="images/favicon-32.png" type="image/png" sizes="32x32"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/variables.css"/>
<link rel="stylesheet" href="css/login.css"/>
</head>
<body>
<div class="page">
  <div class="panel-left">
    <div class="brand">
      <div class="xu-logo-panel">
        <img class="xu-logo" src="images/xu-logo.png" width="280" height="180" alt="Xavier University – Ateneo de Cagayan"/>
      </div>
    </div>
    <div class="panel-tagline">
      <h1>Book a Room.<br/>Get Things<br/><em>Done.</em></h1>
      <p>Reserve a confab room in seconds.</p>
    </div>
    <div class="panel-dots">
      <span class="active"></span><span></span><span></span>
    </div>
  </div>

  <div class="panel-right">
    <div class="view active" id="view-login">
      <div class="header" id="role-header">
        <div class="icon-circle" id="role-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <h2 id="role-label">Library Staff</h2>
        <p id="role-sub">Staff accounts are created by an administrator</p>
      </div>

      <div class="alert error" id="error-msg" style="display:none"></div>
      <div class="alert success" id="success-msg" style="display:none"></div>

      <div class="field">
        <label>Email address</label>
        <div class="input-wrap">
          <input type="email" id="email" placeholder="you@xu.edu.ph" autocomplete="email"/>
        </div>
      </div>

      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <input type="password" id="password" class="pw-input" placeholder="Your password" autocomplete="current-password"/>
          <button class="eye-btn" type="button" onclick="togglePw()">
            <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="row">
        <label class="checkbox-label">
          <input type="checkbox" id="remember"/>
          Remember me
        </label>
        <a href="#" class="forgot" onclick="return false;">Forgot password?</a>
      </div>

      <button class="btn-login" type="button" id="login-btn" onclick="handleLogin()">Sign in</button>

      <div class="role-selector">
        <button class="role-tile" onclick="setRole('admin')">Admin</button>
        <button class="role-tile active" onclick="setRole('staff')">Staff</button>
        <button class="role-tile" onclick="setRole('student')">Student</button>
      </div>

      <div class="footer-links" id="footer-links">
        <p>Don't have a student account? <a href="Register.html">Register here</a></p>
      </div>
    </div>
  </div>
</div>

<script src="js/auth-store.js"></script> 
<script src="js/auth-password-toggle.js"></script>
<script src="js/login.js"></script>
</body>
</html>
